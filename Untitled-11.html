<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Ваш Кошик</h1>
        
        <div id="cart-items" class="cart-list">
            <!-- Тут динамічно з'являтимуться товари -->
        </div>

        <div class="cart-summary">
            <h2>Загальна сума: <span id="total-price">0 грн</span></h2>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button onclick="clearCart()"><span>Очистити кошик</span></button>
                <a href="головна.html"><span>На головну</span></a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
